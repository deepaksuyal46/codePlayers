services:
  web:
    build: ./frontend
    env_file: ./frontend/.env.local
    environment:
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    restart: unless-stopped
  worker:
    build: ./frontend
    command: npm run worker
    env_file: ./frontend/.env.local
    environment:
      NODE_ENV: production
    restart: unless-stopped
